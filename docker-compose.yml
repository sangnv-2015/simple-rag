services:
  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: app
    working_dir: /app
    command: bundle exec rackup -s puma -o 0.0.0.0 -p 4567 config.ru
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://rag:rag@db:5432/rag
      TEST_DATABASE_URL: postgres://rag:rag@db:5432/rag_test
      XDG_CACHE_HOME: /cache
    ports:
      - "127.0.0.1:4567:4567"
    volumes:
      - .:/app:ro
      - ./data/raw:/app/data/raw
      - models:/cache
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db

volumes:
  pgdata:
  models:
