embed_model: Xenova/multilingual-e5-small
embed_dim: 384
top_k: 10 #6
max_chunk_chars: 1000 # 1000 Vietnamese chars = 252 tokens (scripts/spikes/RESULTS.md)
min_letters: 20
min_quote_chars: 10
max_pages: 200 # every readable page is one paid model call
max_page_chars: 20000
max_upload_mb: 30
chunking: semantic
min_score: 0.84 # midpoint of unanswerable top-1 max 0.832 and answerable top-1 min 0.851 (evaluation/check_retrieval)
semantic_breakpoint_percentile: 25
semantic_floor: 0.85
semantic_min_units: 5
